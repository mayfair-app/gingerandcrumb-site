# Ginger & Crumb editing panel (Decap CMS)
backend:
  name: github
  repo: mayfair-app/gingerandcrumb-site
  branch: main
  commit_messages:
    update: "Website update: {{slug}}"

media_folder: "gingerandcrumb-site/src/images/uploads"
public_folder: "/images/uploads"
locale: en

collections:
  - name: website
    label: "Website"
    editor: { preview: false }
    files:

      - label: "Weekly availability"
        name: availability
        file: "gingerandcrumb-site/src/_data/availability.json"
        description: "The weeks update automatically every Monday. Week 1 is always the current week. Set how many spots to show as left for each week, in order."
        fields:
          - { label: "Show availability section", name: show, widget: boolean, default: true }
          - { label: "Orders I take per week", name: orders_per_week, widget: number, value_type: int, min: 1 }
          - label: "Spots left to show (this week, next week, week 3, week 4)"
            name: week_spots
            widget: list
            field: { label: "Spots left", name: spots, widget: number, value_type: int, min: 0 }
            default: [0, 0, 4, 8]

      - label: "Menu & prices"
        name: menu
        file: "gingerandcrumb-site/src/_data/menu.json"
        description: "Add, remove or reorder items. Turn off 'Available' to show an item as not available and remove it from the order form."
        fields:
          - label: "Menu sections"
            name: groups
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Section name", name: title, widget: string }
              - label: "Items"
                name: items
                widget: list
                summary: "{{fields.name}}: {{fields.price}}"
                fields:
                  - { label: "Name", name: name, widget: string }
                  - { label: "Description", name: description, widget: text }
                  - { label: "Price (e.g. $24 / dozen)", name: price, widget: string }
                  - { label: "Available", name: available, widget: boolean, default: true }
                  - { label: "Photo (optional, square works best)", name: photo, widget: image, required: false }
                  - { label: "Drawing (used when there's no photo)", name: icon, widget: select, default: "cookie", options: ["cookie", "ginger", "cupcake", "cake", "heart", "loaf", "pie", "bar", "box"] }

      - label: "Holiday / seasonal special"
        name: holiday
        file: "gingerandcrumb-site/src/_data/holiday.json"
        description: "Use this for limited drops: Holiday Cookie Box, Valentine's heart cakes, Easter, etc. Update 'Claimed' as orders come in."
        fields:
          - { label: "Show this special", name: show, widget: boolean, default: true }
          - { label: "Small heading", name: kicker, widget: string }
          - { label: "Title", name: title, widget: string }
          - { label: "Details (one per line)", name: details, widget: list, field: { label: "Detail", name: detail, widget: string } }
          - { label: "Price", name: price, widget: string }
          - { label: "Total available", name: total, widget: number, value_type: int, min: 1 }
          - { label: "Claimed so far", name: claimed, widget: number, value_type: int, min: 0 }
          - { label: "Photo (optional)", name: photo, widget: image, required: false }
          - { label: "Drawing (used when there's no photo)", name: icon, widget: select, default: "box", options: ["box", "cookie", "ginger", "cupcake", "cake", "heart", "loaf", "pie", "bar"] }
          - { label: "Add to order form", name: add_to_order_form, widget: boolean, default: true }

      - label: "Order deadlines"
        name: deadlines
        file: "gingerandcrumb-site/src/_data/deadlines.json"
        fields:
          - { label: "Show deadlines", name: show, widget: boolean, default: true }
          - label: "Deadlines"
            name: items
            widget: list
            summary: "{{fields.date}}: {{fields.text}}"
            fields:
              - { label: "Date (e.g. Dec 12)", name: date, widget: string }
              - { label: "What it's for", name: text, widget: string }

      - label: "Business details & page text"
        name: settings
        file: "gingerandcrumb-site/src/_data/settings.json"
        fields:
          - label: "Top banner"
            name: announcement
            widget: object
            fields:
              - { label: "Show banner", name: show, widget: boolean, default: true }
              - { label: "Banner text", name: text, widget: string }
              - { label: "Link text", name: link_text, widget: string, default: "Order now" }
          - { label: "Business name", name: business_name, widget: string }
          - { label: "Logo (round, square image)", name: logo, widget: image }
          - { label: "Your first name", name: baker_name, widget: string }
          - { label: "City", name: city, widget: string }
          - { label: "Province", name: province, widget: string }
          - { label: "Areas you serve", name: service_areas, widget: list, field: { label: "Area", name: area, widget: string } }
          - { label: "Instagram handle (no @)", name: instagram, widget: string }
          - { label: "Email for customers", name: email, widget: string, required: false }
          - { label: "Website address", name: site_url, widget: string, required: false }
          - { label: "Big headline", name: hero_headline, widget: string }
          - { label: "Headline (pink part)", name: hero_highlight, widget: string }
          - { label: "Intro paragraph", name: hero_intro, widget: text }
          - { label: "Main photo (optional)", name: hero_photo, widget: image, required: false }
          - label: "Trust bar (strip under the top section)"
            name: trust_items
            widget: list
            summary: "{{fields.text}}"
            fields:
              - { label: "Text", name: text, widget: string }
              - { label: "Drawing", name: icon, widget: select, default: "heart", options: ["heart", "cookie", "ginger", "cupcake", "cake", "loaf", "pie", "bar", "box"] }
          - { label: "Little badges under the intro", name: hero_badges, widget: list, field: { label: "Badge", name: badge, widget: string } }
          - { label: "About me", name: about, widget: text }
          - { label: "Menu intro", name: menu_intro, widget: text }
          - { label: "Note under the menu", name: menu_note, widget: text }
          - { label: "Special requests heading", name: request_title, widget: string, required: false }
          - { label: "Special requests intro", name: request_intro, widget: text, required: false }
          - { label: "Order notice for cookies and loaves", name: lead_time_regular, widget: string }
          - { label: "Order notice for custom orders and special requests", name: lead_time_custom, widget: string }
          - { label: "Pickup time options", name: pickup_times, widget: list, field: { label: "Time", name: time, widget: string } }
          - { label: "Formspree form ID (set up once, don't change)", name: formspree_id, widget: string }

      - label: "Giveaway page"
        name: giveaway
        file: "gingerandcrumb-site/src/_data/giveaway.json"
        description: "The giveaway page at gingerandcrumb.ca/giveaway. Turn on 'Live' once the details are final so Google can find it."
        fields:
          - { label: "Promote on homepage (menu link + banner)", name: promote, widget: boolean, default: true }
          - { label: "Live (show to Google)", name: live, widget: boolean, default: false }
          - { label: "Headline", name: title, widget: string }
          - { label: "Intro", name: intro, widget: text }
          - { label: "Number of winners", name: winners, widget: number, value_type: int, min: 1 }
          - { label: "Prize (each winner gets)", name: prize, widget: string }
          - { label: "Approximate prize value (e.g. $50)", name: prize_value, widget: string, required: false }
          - { label: "Opens", name: opens, widget: string }
          - { label: "Closes", name: closes, widget: string }
          - { label: "Winners drawn on", name: draw_date, widget: string }
          - { label: "Prize pickup by", name: prize_pickup_by, widget: string }
          - { label: "Coupon % off", name: coupon_percent, widget: number, value_type: int }
          - { label: "Coupon good on orders placed by", name: coupon_expiry, widget: string }
          - { label: "Who can enter", name: eligibility, widget: text }
          - { label: "Google Form embed link (ends in viewform?embedded=true)", name: form_embed_url, widget: string, required: false }
          - label: "Ways to enter"
            name: entries
            widget: list
            summary: "+{{fields.points}} · {{fields.action}}"
            fields:
              - { label: "Action", name: action, widget: string }
              - { label: "Entries", name: points, widget: number, value_type: int, min: 1 }
              - { label: "Small note", name: note, widget: string, required: false }

      - label: "Reviews & testimonials"
        name: testimonials
        file: "gingerandcrumb-site/src/_data/testimonials.json"
        description: "Only add real reviews from real customers, with their permission. Until a review is added, the section shows a \"Be one of our first reviews\" card."
        fields:
          - { label: "Show reviews section", name: show, widget: boolean, default: true }
          - { label: "Heading", name: title, widget: string, default: "Kind words" }
          - { label: "Intro", name: intro, widget: string, required: false }
          - { label: "How many to show before \"Read more\"", name: featured, widget: number, value_type: int, min: 1, default: 6 }
          - label: "Reviews"
            name: items
            widget: list
            summary: "{{fields.name}}: {{fields.quote}}"
            fields:
              - { label: "What they said", name: quote, widget: text }
              - { label: "Name (e.g. Sarah M.)", name: name, widget: string }
              - { label: "Detail (e.g. Christmas cookie tray, Richmond Hill)", name: detail, widget: string, required: false }
              - { label: "Stars (only if they gave a rating)", name: stars, widget: number, value_type: int, min: 1, max: 5, required: false }
              - { label: "Photo (optional, only with permission)", name: photo, widget: image, required: false }

      - label: "FAQ"
        name: faq
        file: "gingerandcrumb-site/src/_data/faq.json"
        fields:
          - label: "Questions"
            name: questions
            widget: list
            summary: "{{fields.q}}"
            fields:
              - { label: "Question", name: q, widget: string }
              - { label: "Answer", name: a, widget: text }
