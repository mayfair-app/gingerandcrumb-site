# Rebuilds the Ginger & Crumb site every Monday so the availability weeks roll forward.
# It updates a small timestamp file inside the site folder, which makes Netlify rebuild.
name: Weekly availability refresh

on:
  schedule:
    - cron: "15 5 * * 1"   # Mondays at 05:15 UTC (12:15am EST / 1:15am EDT)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update refresh timestamp
        run: |
          echo "{ \"refreshed\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" }" > gingerandcrumb-site/src/_data/refreshed.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add gingerandcrumb-site/src/_data/refreshed.json
          git commit -m "Weekly availability refresh"
          git push
